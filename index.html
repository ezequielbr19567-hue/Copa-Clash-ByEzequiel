<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123b78">
  <meta name="description" content="">
  <title>Arena</title>
  <link rel="icon" href="assets/site-image.png">
  <link rel="apple-touch-icon" href="assets/site-image.png">
  <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body class="arena-body cup-only">
  <a class="skip-link" href="#grupos">Pular para a Copa</a>
  <div id="pageLoader" class="page-loader" role="status"><img data-site-image src="assets/site-image.png" alt="" width="88" height="88"><span class="loading-track"></span><span data-setting="loading_text">Carregando</span></div>
  <script src="js/loading.js?v=4"></script>
  <header class="topbar"><div class="container topbar-inner">
    <a class="brand" href="#inicio"><img data-site-image src="assets/site-image.png" alt="" width="40" height="40"><strong data-setting="site_name">Arena</strong></a>
    <nav class="desktop-nav" aria-label="Navegação principal"><a href="#grupos" class="active" aria-current="location" data-setting="groups_title">Fase de grupos</a><a href="#mata-mata" data-setting="bracket_title">Mata-mata</a><a href="#partidas" data-setting="matches_title">Partidas</a></nav>
    <a class="admin-entry" href="admin.html" aria-label="Abrir painel administrativo">Admin <span aria-hidden="true">↗</span></a>
  </div></header>
  <div id="setupWarning" class="setup-warning hidden" role="status"></div>
  <main aria-busy="true">
    <section id="inicio" class="container welcome"><div class="welcome-copy"><span id="activeCupName" class="cup-kicker">Copa</span><h1 data-setting="hero_title">Copa</h1><p data-setting="hero_description" hidden></p><a class="hero-cta" href="#partidas"><span data-setting="cta_label">Ver partidas</span><span aria-hidden="true">→</span></a></div><div class="hero-art"><img class="welcome-image" data-site-image src="assets/site-image.png" alt="" width="280" height="280"></div></section>
    <div class="container season-summary cup-summary" aria-label="Resumo da Copa"><div><div><strong id="participantCount">–</strong><span data-setting="participants_label">Participantes</span></div></div><div><div><strong id="groupCount">–</strong><span data-setting="groups_label">Grupos</span></div></div><div><div><strong id="scheduledCount">–</strong><span data-setting="scheduled_label">Agendadas</span></div></div><div><div><strong id="finishedCount">–</strong><span data-setting="finished_label">Finalizadas</span></div></div></div>
    <section id="grupos" class="section container">
      <div class="section-heading"><div><span class="section-kicker" data-setting="cup_title">Copa</span><h2 data-setting="groups_title">Fase de grupos</h2></div><span id="groupRule" class="result-count"></span></div>
      <div id="groupsGrid" class="groups-grid"></div>
    </section>
    <section id="mata-mata" class="section container"><div class="section-heading"><div><span class="section-kicker" data-setting="cup_title">Copa</span><h2 data-setting="bracket_title">Mata-mata</h2></div><span class="section-icon" aria-hidden="true">♛</span></div><div id="cupTools" class="cup-tools" hidden><label for="cupPhase">Fase<select id="cupPhase"><option value="all">Todas as fases</option></select></label><span id="cupSummary" role="status"></span></div><div id="bracket" class="bracket" tabindex="0" role="region" aria-label="Confrontos de mata-mata"></div></section>
    <section id="partidas" class="section container"><div class="section-heading"><div><h2 data-setting="matches_title">Partidas</h2></div><span id="matchCount" class="result-count" role="status"></span></div><div class="filters" aria-label="Filtrar partidas"><button class="filter active" data-filter="ALL" aria-pressed="true">Todas</button><button class="filter" data-filter="GROUP" aria-pressed="false">Grupos</button><button class="filter" data-filter="KNOCKOUT" aria-pressed="false">Mata-mata</button><button class="filter" data-filter="SCHEDULED" aria-pressed="false">Agendadas</button><button class="filter" data-filter="FINISHED" aria-pressed="false">Finalizadas</button></div><div id="matchesList" class="matches-list"></div></section>
  </main>
  <footer class="container"><span data-setting="footer_text" hidden></span></footer>
  <nav class="bottom-nav" aria-label="Navegação principal"><a href="#grupos" class="active" aria-current="location"><span aria-hidden="true">▦</span><span data-setting="groups_title">Grupos</span></a><a href="#mata-mata"><span aria-hidden="true">♛</span><span data-setting="bracket_title">Mata-mata</span></a><a href="#partidas"><span aria-hidden="true">◫</span><span data-setting="matches_title">Partidas</span></a></nav>
  <noscript><p class="empty">Ative o JavaScript para visualizar a Copa.</p><style>.page-loader{display:none}</style></noscript>
  <script src="js/config.js?v=4"></script><script type="module" src="js/app.js?v=5"></script>
</body>
</html>
